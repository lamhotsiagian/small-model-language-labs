# Lab 7: Llama-style 150M SLM pretraining configuration.
# ~151M parameters with the SmolLM2 tokenizer (49,152 vocab, tied embeddings).

model:
  vocab_size: 49152
  d_model: 768
  n_layers: 18
  n_heads: 12
  n_kv_heads: 4          # GQA 3:1
  d_ff: 2048             # SwiGLU, 2.67x
  max_seq_len: 2048
  rope_theta: 10000.0
  tie_embeddings: true
  qk_norm: true          # cheap insurance at a high learning rate

train:
  total_tokens: 5.0e9    # ~33 tokens/param; raise for a stronger model
  seq_len: 2048
  micro_batch: 16        # per GPU
  global_batch_tokens: 1048576   # ~1M tokens/step -> grad accumulation is derived
  lr: 3.0e-3
  min_lr_ratio: 0.1
  warmup_steps: 1000
  schedule: wsd
  decay_frac: 0.2
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  clip: 1.0
  z_loss: 1.0e-4
  activation_checkpointing: false   # 150M fits comfortably; turn on for >1B
  compile: true

eval:
  every_steps: 500
  val_batches: 50
  hellaswag_every_steps: 2000
  hellaswag_items: 1000

checkpoint:
  dir: checkpoints/slm150m
  every_steps: 1000
  keep_last: 3

hardware:
  peak_tflops_per_gpu: 989   # H100 SXM dense BF16; A100 = 312, L4 = 121, 4090 = 165
